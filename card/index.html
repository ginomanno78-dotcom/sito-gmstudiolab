<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a2456">
<title>Gino Manno | GM Studio Lab</title>
<meta name="description" content="Sviluppatore web &amp; consulente AI">
<style>
  :root{
    --navy:#1a2456; --navy-deep:#111a40; --cyan:#00d4ff; --orange:#ff5500;
    --text:#ffffff; --muted:#b9c2e6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh; min-height:100dvh;
    background:#1a2456;                 /* sfondo piatto, nessun alone */
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; justify-content:center; align-items:center;
    padding:calc(14px + env(safe-area-inset-top)) 20px calc(14px + env(safe-area-inset-bottom));
  }
  .card{width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; text-align:center}
  .avatar{
    width:104px; height:104px; border-radius:50%;
    display:grid; place-items:center;
    font-size:38px; font-weight:700; letter-spacing:1px;
    background:var(--navy-deep); color:var(--cyan);
    border:2px solid var(--cyan);
    box-shadow:0 0 0 6px rgba(0,212,255,.12), 0 10px 30px rgba(0,0,0,.35);
    margin-top:12px;
  }
  h1{font-size:26px; line-height:1.15; margin-top:clamp(12px,2.2vh,20px); font-weight:700}
  .ruolo{margin-top:6px; font-size:16px; color:var(--cyan); font-weight:600}
  .desc{margin-top:clamp(8px,1.6vh,14px); font-size:14px; line-height:1.45; color:var(--muted); max-width:34ch}
  .actions{width:100%; margin-top:clamp(12px,2.4vh,22px); display:grid; gap:10px}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    min-height:54px; padding:0 18px; border-radius:14px;
    font-size:16px; font-weight:600; text-decoration:none; color:var(--text);
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16);
    transition:transform .08s ease, background .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.98)}
  .btn:hover{background:rgba(255,255,255,.12)}
  .btn:focus-visible{outline:3px solid var(--cyan); outline-offset:2px}
  .btn svg{width:22px; height:22px; flex:none}
  .btn.primary{background:var(--orange); border-color:var(--orange); color:#fff; font-size:17px; min-height:58px}
  .btn.primary:hover{background:#ff6a22}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  /* Riquadro lilla dietro il logo: angoli arrotondati 10px, colore #BA9BC9 */
  .logo-box{width:100%; background:#BA9BC9; border-radius:10px; padding:clamp(14px,3.4vh,30px) 7%}
  .logo{display:block; width:100%; height:auto}
  .contacts{list-style:none; margin-top:clamp(10px,2vh,16px); display:grid; gap:7px; justify-items:center}
  .contacts li, .contacts a{display:flex; align-items:center; gap:10px; font-size:15px; color:var(--text); text-decoration:none}
  .contacts a:hover{color:var(--cyan)}
  .contacts svg{width:18px; height:18px; flex:none; color:var(--cyan)}
  .btn.wa{background:#25D366; border-color:#25D366; color:#fff}
  .btn.wa:hover{background:#2fe173}
  /* Schermi bassi: riduco un po' le misure cosi' tutto resta in una sola schermata */
  @media (max-height:740px){
    .btn{min-height:48px; font-size:15px}
    .btn.primary{min-height:52px; font-size:16px}
    .contacts{gap:5px}
    .contacts li, .contacts a{font-size:14px}
  }
  @media (max-height:620px){
    h1{font-size:23px}
    .desc{font-size:13px; line-height:1.35}
    .btn{min-height:42px}
    .btn.primary{min-height:46px}
    .actions{gap:8px}
  }
</style>
</head>
